<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무지개 정원</title>
<meta name="description" content="강아지와 함께 정원을 깡충깡충 거니는 힐링 게임.">
<meta name="color-scheme" content="light">
<meta property="og:title" content="무지개 정원">
<meta property="og:description" content="강아지와 함께 정원을 깡충깡충 거니는 힐링 게임.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* hidden 이 걸린 요소는 반드시 사라져야 한다. display 를 지정한 요소는
     hidden 만으로는 숨지 않고, 안 보이는 채로 클릭을 가로챈다. */
  [hidden]{display:none!important}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#DCEFF6;
    color:#4A4440;
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .hand{font-family:"Gaegu","IBM Plex Sans KR",cursive}

  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ── 머리 위 이름표와 말풍선 ── */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .label{
    position:absolute;top:0;left:0;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    will-change:transform;
  }
  .tag{
    font-size:11.5px;font-weight:600;color:#5B5047;
    background:rgba(255,255,255,.88);
    border-radius:999px;padding:2px 10px;white-space:nowrap;
    box-shadow:0 2px 6px rgba(90,80,70,.16);
  }
  .label.pet .tag{font-size:10.5px;color:#8A7A6A;padding:1px 8px}
  .bubble{
    position:relative;
    max-width:min(230px, 54vw);
    background:#fff;color:#4A4440;
    font-size:13.5px;line-height:1.5;font-weight:500;
    border-radius:16px;padding:9px 13px;
    box-shadow:0 5px 16px rgba(90,80,70,.2);
    overflow-wrap:anywhere;text-align:center;
    animation:pop .22s cubic-bezier(.3,1.5,.6,1);
    transition:opacity .42s ease, transform .42s ease;
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-6px;
    width:0;height:0;transform:translateX(-50%);
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-top:7px solid #fff;
  }
  .bubble.fade{opacity:0;transform:translateY(-6px)}
  @keyframes pop{
    from{opacity:0;transform:scale(.8) translateY(8px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }

  /* ── 화면 위 UI ── */
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.9);
    border:0;border-radius:999px;padding:6px 13px;min-height:32px;
    font-size:12px;font-weight:500;color:#6B6057;
    text-decoration:none;
    box-shadow:0 3px 10px rgba(90,80,70,.14);
  }
  a.chip:hover{background:#fff}

  #hud{
    position:fixed;z-index:5;
    top:calc(12px + env(safe-area-inset-top, 0px));
    left:calc(12px + env(safe-area-inset-left, 0px));
    right:calc(12px + env(safe-area-inset-right, 0px));
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  }
  #hud .spacer{flex:1 1 auto}

  /* ── 방향 패드 ── */
  #pad{
    position:fixed;z-index:6;
    left:calc(16px + env(safe-area-inset-left, 0px));
    bottom:calc(78px + env(safe-area-inset-bottom, 0px));
    display:grid;
    grid-template-columns:repeat(3, 46px);
    grid-template-rows:repeat(3, 46px);
    gap:4px;
    touch-action:none;
  }
  #pad button{
    grid-area:var(--at);
    font:inherit;font-size:17px;line-height:1;
    color:#7A6A5C;background:rgba(255,255,255,.88);
    border:0;border-radius:15px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(90,80,70,.16);
    transition:transform .08s ease, background .12s ease;
  }
  #pad button.on{transform:scale(.9);background:#FFF4DA}
  #pad [data-dir="f"]{--at:1 / 2}
  #pad [data-dir="l"]{--at:2 / 1}
  #pad [data-dir="r"]{--at:2 / 3}
  #pad [data-dir="b"]{--at:3 / 2}

  #help{
    position:fixed;z-index:5;
    right:calc(14px + env(safe-area-inset-right, 0px));
    bottom:calc(84px + env(safe-area-inset-bottom, 0px));
    max-width:min(210px, 46vw);text-align:right;
    font-size:11.5px;line-height:1.65;color:#7A6E63;
    background:rgba(255,255,255,.72);
    border-radius:12px;padding:7px 11px;
  }
  #help b{font-weight:600;color:#5B5047}

  /* ── 대화 입력 ── */
  #chat{
    position:fixed;z-index:6;
    left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    width:min(500px, calc(100% - 24px));
    display:flex;gap:7px;
  }
  #chatInput{
    flex:1 1 auto;min-width:0;
    font:inherit;font-size:16px;   /* 16px 미만이면 iOS 가 입력칸을 누를 때 화면을 확대한다 */
    color:#4A4440;background:rgba(255,255,255,.95);
    border:0;border-radius:999px;padding:10px 17px;min-height:44px;
    box-shadow:0 4px 14px rgba(90,80,70,.18);
  }
  #chatInput::placeholder{color:#A99D91}
  #chatInput:focus{outline:2px solid #8FC9E0;outline-offset:1px}
  #chat button{
    font:inherit;font-size:13.5px;font-weight:600;
    color:#fff;background:#8CC0A5;
    border:0;border-radius:999px;padding:0 18px;min-height:44px;
    cursor:pointer;flex:none;
    box-shadow:0 4px 14px rgba(90,80,70,.2);
  }
  #chat button:hover{background:#7CB295}

  /* ── 시작 화면 ── */
  #start{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(170deg, #DCEFF6 0%, #E9F3DC 55%, #FBEEDC 100%);
  }
  #start .card{
    width:min(380px, 100%);
    background:rgba(255,255,255,.9);
    border-radius:26px;padding:28px 24px 24px;
    box-shadow:0 18px 48px rgba(90,80,70,.18);
    text-align:center;
  }
  #start .arc{display:flex;justify-content:center;gap:5px;margin-bottom:14px}
  #start .arc i{width:13px;height:13px;border-radius:50%;display:block}
  #start h1{
    font-family:"Gaegu","IBM Plex Sans KR",cursive;
    font-size:40px;font-weight:700;margin:0;color:#5B5047;letter-spacing:.01em;
  }
  #start p.lead{margin:6px 0 20px;color:#8A7E72;font-size:13px;line-height:1.6}
  #start label{
    display:block;text-align:left;
    font-size:12px;font-weight:600;color:#7A6E63;margin:0 0 5px 4px;
  }
  #start input{
    font:inherit;font-size:16px;width:100%;
    color:#4A4440;background:#fff;
    border:1.5px solid #E4DCCF;border-radius:14px;
    padding:11px 14px;min-height:46px;margin-bottom:13px;
  }
  #start input::placeholder{color:#B5A99C}
  #start input:focus{outline:0;border-color:#8FC9E0}
  #start button{
    font:inherit;font-size:15px;font-weight:600;
    width:100%;color:#fff;background:#8CC0A5;
    border:0;border-radius:999px;min-height:50px;cursor:pointer;margin-top:4px;
  }
  #start button:hover{background:#7CB295}
  #start .note{margin:14px 0 0;font-size:11.5px;color:#A1958A;line-height:1.6}

  #loading{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    background:#DCEFF6;color:#7A6E63;font-size:13px;font-weight:500;
  }

  @media (prefers-reduced-motion: reduce){
    .bubble{animation:none}
    #pad button{transition:none}
  }
  @media (max-width:420px){
    #pad{grid-template-columns:repeat(3, 42px);grid-template-rows:repeat(3, 42px)}
    #help{display:none}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.min.js"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="hud">
  <a class="chip" href="../">← 게임</a>
  <span class="spacer"></span>
  <span class="chip" id="who">—</span>
  <span class="chip" id="count">1명</span>
</div>

<div id="pad">
  <button type="button" data-dir="f" aria-label="앞으로 점프">▲</button>
  <button type="button" data-dir="l" aria-label="왼쪽으로 점프">◀</button>
  <button type="button" data-dir="r" aria-label="오른쪽으로 점프">▶</button>
  <button type="button" data-dir="b" aria-label="뒤로 점프">▼</button>
</div>

<p id="help">
  <b>WASD</b> · <b>방향키</b> 로 깡충<br>
  끌어서 둘러보기 · <b>Enter</b> 로 말하기
</p>

<form id="chat" autocomplete="off">
  <input id="chatInput" type="text" maxlength="60" placeholder="말을 적으면 머리 위에 뜹니다" aria-label="대화 입력">
  <button type="submit">말하기</button>
</form>

<div id="loading" hidden>정원을 여는 중…</div>

<div id="start">
  <form class="card" id="startForm" autocomplete="off">
    <div class="arc">
      <i style="background:#F28B82"></i><i style="background:#F7B267"></i>
      <i style="background:#F6DD72"></i><i style="background:#9BD178"></i>
      <i style="background:#7EC8E3"></i><i style="background:#8B9FE8"></i>
      <i style="background:#C49BE0"></i>
    </div>
    <h1>무지개 정원</h1>
    <p class="lead">강아지와 함께 천천히 거니는 정원이에요.<br>이름을 알려주시면 문을 열어 드릴게요.</p>

    <label for="nameInput">당신의 이름</label>
    <input id="nameInput" type="text" maxlength="12" required placeholder="캐릭터 이름이 됩니다">

    <label for="dogInput">강아지 이름</label>
    <input id="dogInput" type="text" maxlength="12" required placeholder="곁에서 따라다녀요">

    <button type="submit">정원으로 들어가기</button>
    <p class="note">서두를 것도, 지는 것도 없는 곳이에요.</p>
  </form>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>

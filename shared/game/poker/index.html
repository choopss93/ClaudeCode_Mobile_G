<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- 확대를 막는다. 사파리는 user-scalable 을 무시하므로 아래 CSS(touch-action)와
     main.js 의 gesturestart 막기로 한 번 더 붙든다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memory Poker</title>
<meta name="description" content="16장을 20초 동안 외우고, 두 칸을 골라 포커 족보로 겨루는 1~4인 온라인 게임.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:title" content="Memory Poker">
<meta property="og:description" content="16장을 외우고 두 칸을 골라 겨뤄요. 1~4명.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../../assets/base.css">
<style>
  /* 공용 공간의 강조색 */
  :root{ --accent:#8A5A24; --accent-soft:#F2E8DA }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --accent:#DCA94E; --accent-soft:#33281A }
  }
  :root[data-theme="dark"]{ --accent:#DCA94E; --accent-soft:#33281A }

  /* 이 게임은 늘 검정 바탕이다 (사용자 요청). 테마를 다크로 묶고
     바탕만 더 검게 — 흰 카드가 또렷이 떠 보이게 */
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#111111; --surface-2:#1C1C1C; --line:#2A2A2A;
    --ink:#F2F2F2; --muted:#9C9C9C; --faint:#6E6E6E;
  }
  .up{color:#6CCB8A!important} .down{color:#F08A6A!important}

  /* 카드 앞면은 밤에도 흰 종이다 — 진짜 카드처럼 */
  :root{ --paper:#FFFDF8; --paper-ink:#24221F; --paper-red:#C8424A; --pick:#FFFFFF; --gap:7px; }

  /* ─── 한 화면에 고정: 확대도 스크롤도 없다 ───
     몸통을 화면에 못 박고(fixed) 넘치는 것은 자른다. 대신 모든 것이
     화면 크기에 맞춰 줄어들게 짠다 — 아래 판은 남은 자리만큼만 커진다. */
  html{height:100%;overflow:hidden;touch-action:manipulation;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input{-webkit-user-select:text;user-select:text}
  /* 사파리는 16px 보다 작은 칸에 들어가면 저절로 확대한다 */
  .field{font-size:16px}

  .wrap{height:100%;max-width:560px;display:flex;flex-direction:column;
    padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    padding-bottom:max(10px, env(safe-area-inset-bottom))}
  section{flex:1;min-height:0;display:flex;flex-direction:column}
  .ver{flex:none;margin:4px 0 0;text-align:center;color:var(--faint);font-size:10.5px;height:14px;line-height:14px}

  /* ─── 첫 화면 ─── */
  #lobby header{padding-block:14px 12px}
  #lobby .back{margin-bottom:8px}
  #lobby .panel{margin-top:14px;padding:16px 14px;gap:9px}
  #lobby label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  #lobby .or{color:var(--faint);font-size:12px;text-align:center;margin:0}
  #lobby .btn{min-height:46px;font-size:15px}
  #joinForm{display:flex;gap:8px}
  #joinForm .field{text-transform:uppercase;letter-spacing:.1em;min-width:0}
  #joinForm .btn{white-space:nowrap;flex:none;padding-inline:18px}
  /* 가운데 카드 장수 — 둥근 라디오 둘. 방을 만든 사람(방장)의 것이 방의 규칙이 된다 */
  /* fieldset/legend 는 쓰지 않는다 — 아이폰 사파리가 legend 를 제 줄로 빼내
     칸이 좁아지고 '3장' 이 세로로 꺾였다. 보통 div 로 세 칸을 나눈다. */
  .seg{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-width:0}
  .seg .lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  /* #lobby label(이름 칸 머리글)보다 구체적이어야 덮인다 */
  #lobby .seg label{display:flex;align-items:center;gap:7px;min-height:44px;min-width:0;padding:0 10px 0 12px;cursor:pointer;font-size:inherit;font-weight:400;color:inherit;
    border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin:0;-webkit-tap-highlight-color:transparent}
  #lobby .seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .seg input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:18px;height:18px;border-radius:50%;
    border:2px solid var(--faint);display:grid;place-content:center}
  .seg input::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .12s}
  .seg input:checked{border-color:var(--accent)}
  .seg input:checked::before{transform:scale(1)}
  .seg input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* 글자는 절대 꺾지 않는다. 자리가 모자라면 작은 설명만 줄임표로 */
  .seg label span{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
  .seg small{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* 좁은 폰에서는 반쯤 잘린 설명보다 아예 없는 편이 낫다 */
  @media (max-width:370px){ .seg small{display:none} }
  #lobbyMsg{color:#F08A6A;font-size:12.5px;min-height:1.2em;margin:0}
  .rules{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .rules li{margin:2px 0}
  /* 족보 보기 — 첫 화면 맨 아래, 엄지가 닿는 자리 */
  #handsBtn{margin-top:auto;margin-bottom:4px;flex:none;width:100%;min-height:46px;font-size:15px;gap:8px}
  #handsBtn .ic{display:inline-flex;gap:2px}
  #handsBtn .ic i{font-style:normal;font-size:13px;color:var(--muted)}
  #handsBtn .ic i.r{color:#F08A6A}
  @media (max-height:640px){
    #lobby .sub{display:none}
    #lobby .panel{margin-top:10px}
    .rules{font-size:11.5px;margin-top:8px}
  }
  /* 아이폰 SE 처럼 낮은 화면 — 사이를 좁혀 족보 단추까지 한 화면에 */
  @media (max-height:600px){
    #lobby header{padding-block:8px 8px}
    #lobby .back{margin-bottom:4px}
    #lobby h1{font-size:22px}
    #lobby .panel{margin-top:8px;padding:12px 12px;gap:7px}
    #lobby .or{display:none}
    #lobby .btn,#handsBtn,#lobby .seg label{min-height:42px}
    #lobby .field{min-height:42px;padding-block:7px}
    #lobbyMsg{min-height:0}
    .rules{margin-top:6px;line-height:1.4}
  }
  /* 가로로 눕힌 폰: 제목은 왼쪽, 입력은 오른쪽 */
  @media (orientation:landscape) and (max-height:520px){
    #lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto 1fr auto;column-gap:18px;
      padding-top:env(safe-area-inset-top)}
    #lobby header{grid-column:1;border:0;padding-bottom:0}
    #lobby .rules{grid-column:1;grid-row:2;display:block;margin-top:4px}
    #lobby .panel{grid-column:2;grid-row:1 / -1;align-self:center;margin:0;padding:12px 14px;gap:7px}
    #lobby .sub{display:block}
    #lobby .btn{min-height:44px}
    #lobby .field{min-height:42px;padding-block:7px}
    #lobbyMsg{min-height:0}
    #handsBtn{grid-column:1;grid-row:3;min-height:40px;margin:0 0 4px}
  }

  /* ─── 방 화면 ───
     자리마다 높이를 **고정**한다. 단계가 바뀌어도(외우기 → 고르기 → 결과)
     글줄이 생기고 사라지며 판이 밀리는 일이 없게. 결과와 사람별 자세한
     내용은 화면에 늘어놓지 않고 아래에서 올라오는 창(.sheet)에 띄운다. */
  #room{padding-top:max(8px, env(safe-area-inset-top));gap:8px}
  .top{display:flex;align-items:center;gap:6px;flex:none;min-width:0;height:36px}
  .top .back{margin:0;min-height:36px;flex:none;font-size:13px}
  .top .spacer{flex:1}
  .top .pill{white-space:nowrap;min-width:0;min-height:32px}
  #roomBtn{font:inherit;cursor:pointer;color:var(--ink);gap:6px}
  #roomBtn .code{font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  #roomBtn .inv{color:var(--accent);font-weight:600}
  #netText{overflow:hidden;text-overflow:ellipsis;max-width:18vw}

  /* 자리 — 이름과 점수만. 누르면 그 사람 창이 뜬다 */
  #seats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:none}
  #seats button{all:unset;box-sizing:border-box;width:100%;height:44px;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 7px;
    display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr 1fr;column-gap:4px;align-items:center;
    font-size:12px;-webkit-tap-highlight-color:transparent}
  #seats button:active{background:var(--surface-2)}
  #seats button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #seats .me button{border-color:var(--accent);background:var(--accent-soft)}
  #seats .out button{opacity:.45}
  #seats .emptyseat{height:44px;border:1px dashed var(--line);border-radius:10px;color:var(--faint);
    display:flex;align-items:center;justify-content:center;font-size:11.5px}
  #seats .nm{grid-column:1 / -1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  #seats .nm em{font-style:normal;color:var(--accent);margin-right:2px}
  #seats .sc{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  #seats .pk{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.1}

  .status{display:flex;align-items:center;gap:10px;flex:none;min-width:0;height:44px}
  .status .txt{flex:1;min-width:0}
  #phase,#hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
  #phase{font-size:17px;font-weight:700;line-height:24px;height:24px}
  #hint{color:var(--muted);font-size:12.5px;line-height:18px;height:18px}
  #count{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);width:1.5em;text-align:right;line-height:1;flex:none}
  .track{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;flex:none}
  #bar{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
  body[data-phase="pick"] #bar{background:#F2F2F2}

  /* 판 — 남은 자리(.board)의 폭과 높이 중 작은 쪽에 맞추고, 조금 여유를 둔다.
     카드 비율이 3:4 이므로 높이 H 에 들어가는 폭은 (H − 간격3) × 3/4 + 간격3 */
  .board{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);
    width:min(92cqw, 400px, calc((96cqh - 3 * var(--gap)) * 0.75 + 3 * var(--gap)))}
  .cell{all:unset;box-sizing:border-box;aspect-ratio:3/4;border-radius:8px;position:relative;
    display:flex;align-items:center;justify-content:center;cursor:default;container-type:inline-size;
    -webkit-tap-highlight-color:transparent}
  .cell.up{background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.6)}
  .cell.back{background:var(--accent);color:var(--accent-ink);
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 6px,transparent 6px 12px)}
  .cell.back:not(:disabled){cursor:pointer}
  .cell.back:not(:disabled):active{filter:brightness(.9)}
  /* 고른 칸은 테두리만 — 들썩이면 판이 흔들려 보인다 */
  .cell.sel,.cell.chosen{outline:3px solid var(--pick);outline-offset:2px}
  .cell:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ltr{font-size:36cqw;font-weight:700}
  .cell .tag{position:absolute;right:7cqw;bottom:4cqw;font-size:14cqw;font-weight:600;color:#9A9488}
  .cell .face b{font-size:30cqw}
  .cell .face i{font-size:30cqw;margin-top:3cqw}

  .face{display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--paper-ink)}
  .face.red{color:var(--paper-red)}
  .face b{font-weight:700}
  .face i{font-style:normal}

  /* 아래 — 가운데 카드 한 줄 + 단추 한 줄. 두 줄 모두 높이가 늘 같다 */
  .foot{flex:none;display:flex;flex-direction:column;gap:8px}
  .commrow{display:flex;align-items:center;justify-content:center;gap:8px;height:52px}
  .commrow .lbl{font-size:11.5px;color:var(--muted)}
  #comm{display:flex;gap:8px;align-items:center;height:52px}
  .mini{width:39px;aspect-ratio:3/4;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;container-type:inline-size;flex:none}
  .mini.up{background:var(--paper)}
  .mini.back{background:var(--surface-2);border:1px dashed var(--line)}
  .mini .face b,.mini .face i{font-size:36cqw}
  .mini.own{outline:2px solid var(--pick);outline-offset:1px}
  /* 빈 자리와 펼친 카드가 같은 높이여야 줄이 들썩이지 않는다 — 빈 칸은 비율만으로는 높이가 안 잡힌다 */
  #comm .mini{height:52px;aspect-ratio:auto}
  .actions{display:flex;gap:8px;height:46px}
  .actions .btn{flex:1;min-height:46px;font-size:15px}
  .actions .wait{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
    border:1px dashed var(--line);border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}

  /* ─── 올라오는 창 (결과 · 사람별) ─── */
  .sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.62);animation:fade .16s ease-out}
  .sheet .card2{width:100%;max-width:560px;max-height:min(86dvh, 640px);display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
    padding:8px 16px max(14px, env(safe-area-inset-bottom));animation:rise .2s ease-out}
  .sheet .grip{width:38px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 8px;flex:none}
  .sheet header{display:flex;align-items:center;gap:8px;padding:0;border:0;flex:none}
  .sheet h2{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .x{all:unset;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;color:var(--muted);font-size:20px;flex:none}
  .sheet .x:active{background:var(--surface-2)}
  .sheet .sub2{margin:2px 0 10px;color:var(--muted);font-size:12.5px;flex:none}
  /* 넷이면 다 들어간다. 그래도 넘치면 창 안에서만 넘긴다 */
  .sheet .body{min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
  .sheet .btns{display:flex;gap:8px;margin-top:12px;flex:none}
  .sheet .btns .btn{flex:1;min-height:46px;font-size:15px}

  /* 족보 표 — 이 창만은 안에서 넘겨 볼 수 있다 */
  #handList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  #handList li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:8px;row-gap:6px;
    align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
  #handList li.off{opacity:.5}
  #handList .no{grid-row:1 / span 2;align-self:start;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px}
  #handList .nm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #handList .ok{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
  #handList li:not(.off) .ok{color:var(--accent);border-color:var(--accent)}
  #handList .ds{grid-column:2 / -1;font-size:12px;color:var(--muted);line-height:1.45}
  #handList .ex{grid-column:2 / -1;display:flex;gap:4px}
  #handList .mini{width:30px;border-radius:5px}
  #handList .mini.dim{opacity:.38}
  .tips{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:12.5px;line-height:1.6}
  .tips b{color:var(--accent)}
  .tips p{margin:0}
  @keyframes fade{from{opacity:0}}
  @keyframes rise{from{transform:translateY(24px);opacity:.4}}

  #results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  #results li{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    display:flex;align-items:center;gap:10px;min-width:0}
  #results li.win{border-color:var(--accent)}
  #results .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
  #results .who b,#results .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #results .who b{font-size:14px}
  #results .who span{font-size:11.5px;color:var(--muted)}
  #results small,.person small{font-size:10.5px;color:var(--muted);font-weight:500}
  .row4{display:flex;gap:4px;flex:none}
  #results .mini{width:clamp(26px, 8vw, 34px);border-radius:5px}
  #results .pt{font-weight:700;font-variant-numeric:tabular-nums;width:2.3em;text-align:right;flex:none;font-size:15px}

  /* 사람 창 */
  .person .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .person .stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
  .person .stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
  .person .stats span{font-size:11px;color:var(--muted)}
  .person h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
  .person .now{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;min-height:56px}
  .person .now .mini{width:34px}
  .person .now p{margin:0;font-size:13px}
  .person .tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}

  /* 낮은 화면(가로로 눕힌 폰): 판을 왼쪽에, 나머지를 오른쪽에 */
  @media (orientation:landscape) and (max-height:520px){
    .wrap{max-width:none}
    #room{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;
      column-gap:16px;row-gap:6px}
    #room > .board{grid-column:1;grid-row:1 / -1;width:calc((100dvh - 24px) * 0.72);height:100%}
    #room > :not(.board){grid-column:2}
    #room > .foot{align-self:end}
    .commrow{height:44px} .mini{width:32px} #comm .mini{height:43px} #comm{height:43px}
    .ver{display:none}
    /* 창도 낮은 화면에 맞춰 촘촘히, 옆으로 나란히 */
    .sheet .card2{max-height:96dvh;max-width:680px;padding-top:6px}
    .sheet .grip{display:none}
    .sheet h2{font-size:16px}
    .sheet .x{width:34px;height:34px}
    .sheet .sub2{margin:0 0 6px}
    .sheet .btns{margin-top:8px}
    .sheet .btns .btn{min-height:40px}
    #results{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    #results li{padding:5px 8px;gap:6px}
    #results .mini{width:24px}
    .person{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;align-items:start}
    .person .tags{grid-column:1 / -1;margin-bottom:6px}
    .person .stats{margin:0;grid-row:2 / span 2}
    .person .stats div{padding:6px 8px}
    .person .stats b{font-size:17px}
    .person h3{grid-column:2;margin-bottom:4px}
    .person .now{grid-column:2;min-height:0;padding:6px 8px}
    .person .now .mini{width:26px}
  }

  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <section id="lobby">
    <header>
      <a class="back" href="../../">← Metaversal Studio</a>
      <h1>Memory Poker</h1>
      <p class="sub">16장을 외우고, 두 칸을 골라 포커 족보로 겨뤄요. 1~4명.</p>
    </header>

    <div class="panel stack">
      <div>
        <label for="name">내 이름</label>
        <input class="field" id="name" maxlength="12" autocomplete="nickname" placeholder="친구들에게 보일 이름">
      </div>
      <div class="seg" role="radiogroup" aria-labelledby="commLbl">
        <span class="lbl" id="commLbl">가운데 카드</span>
        <label><input type="radio" name="comm" value="2"><span>2장</span><small>4장 족보</small></label>
        <label><input type="radio" name="comm" value="3"><span>3장</span><small>5장 족보</small></label>
      </div>
      <button class="btn primary" id="make" type="button">새 방 만들기</button>
      <p class="or">또는 받은 방 코드로</p>
      <form id="joinForm">
        <input class="field" id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABC-123" aria-label="방 코드">
        <button class="btn" type="submit">들어가기</button>
      </form>
      <p id="lobbyMsg" role="alert"></p>
    </div>

    <ol class="rules">
      <li>4×4 로 깔린 16장을 <b>20초</b> 동안 외워요.</li>
      <li>카드가 뒤집히고 가운데에 <span data-comm>2</span>장이 놓여요.</li>
      <li><b>10초</b> 안에 A~P 칸 중 두 칸을 골라요.</li>
      <li>고른 2장 + 가운데 <span data-comm>2</span>장, <span data-total>4</span>장으로 족보를 내요.</li>
      <li>이긴 한 명 <b>+1</b>, 나머지 <b>−1</b>. 동점이면 1등끼리 결승.</li>
    </ol>

    <button class="btn" id="handsBtn" type="button"><span class="ic"><i>♠</i><i class="r">♥</i></span>포커 족보 보기</button>
  </section>

  <section id="room" hidden>
    <div class="top">
      <a class="back" href="./">← 나가기</a>
      <button class="pill" id="roomBtn" type="button" aria-label="친구 부르기">방 <span class="code" id="roomCode"></span> <span class="inv">초대</span></button>
      <span class="spacer"></span>
      <span class="pill"><span class="dot off" id="netDot"></span><span id="netText">연결 중</span></span>
    </div>

    <ul id="seats"></ul>

    <div class="status">
      <div class="txt">
        <p id="phase">기다리는 중</p>
        <p id="hint"></p>
      </div>
      <span id="count" aria-live="polite"></span>
    </div>
    <div class="track"><div id="bar"></div></div>

    <div class="board"><div id="grid"></div></div>

    <div class="foot">
      <div class="commrow"><span class="lbl">가운데</span><span id="comm"></span></div>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <p class="ver">판 13</p>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="card2">
    <div class="grip"></div>
    <header><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" type="button" aria-label="닫기">✕</button></header>
    <p class="sub2" id="sheetSub"></p>
    <div class="body" id="sheetBody"></div>
    <div class="btns" id="sheetBtns"></div>
  </div>
</div>
<div id="toast" hidden></div>
<script type="module" src="js/main.js?v=13"></script>
</body>
</html>

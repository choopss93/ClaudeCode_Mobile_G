<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기타</title>
<meta name="description" content="오래 두지 않을 것들. 실험하거나 잠깐 쓰고 버릴 페이지를 올립니다.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="기타">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/base.css">
<style>
  /* 이 공간의 강조색 */
  :root{ --accent:#6B3F6E; --accent-soft:#EEE2EF }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --accent:#C293C6; --accent-soft:#2C1F2E }
  }
  :root[data-theme="dark"]{ --accent:#C293C6; --accent-soft:#2C1F2E }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 전체 공간</a>
    <p class="eyebrow">공간 4 · 임시</p>
    <h1>기타</h1>
    <p class="sub">오래 두지 않을 것들. 실험하거나 잠깐 쓰고 버릴 페이지를 올립니다.</p>
  </header>

  <main class="panel">
    <div class="empty">
      <b>아직 비어 있어요</b>
      급하게 올릴 것이 있으면 여기에 두세요.
    </div>
  </main>

  <footer>
    <span class="spacer"></span>
    <button class="info" type="button" data-sheet="about">ⓘ 이 페이지 안내</button>
  </footer>
</div>
<div class="sheet" id="about" hidden role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="card2">
    <div class="grip"></div>
    <header><h2 id="aboutTitle">이 페이지 안내</h2><button class="x" type="button" data-close aria-label="닫기">✕</button></header>
    <div class="body"><p style="margin:4px 0 0;color:var(--muted);font-size:13px">
      이 페이지는 <code>etc/index.html</code> 입니다.
    임시 공간이라 언제든 비워도 괜찮습니다.
    </p></div>
    <div class="btns"><button class="btn" type="button" data-close>닫기</button></div>
  </div>
</div>
<script src="../assets/ui.js"></script>
</body>
</html>
